<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جدولي الدراسي</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#667;--ac:#2f6fed;--lec:#e8453c;--lab:#0f9d8a;--sec:#3b7dd8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--card:#1c1f2a;--tx:#eef0f6;--mut:#9aa1b5}}
:root[data-theme="dark"]{--bg:#12141b;--card:#1c1f2a;--tx:#eef0f6;--mut:#9aa1b5}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 14px}
.next{background:var(--ac);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:16px}
.next small{opacity:.85}.next b{display:block;font-size:18px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.tabs button{flex:1;min-width:64px;border:0;border-radius:12px;padding:10px 6px;background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff}
.tabs button.today:not(.on){outline:2px solid var(--ac)}
.cls{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;border-inline-start:6px solid var(--lec)}
.cls.lab{border-color:var(--lab)}.cls.sec{border-color:var(--sec)}
.cls h3{margin:0 0 4px;font-size:16px}
.t{font-weight:700;color:var(--ac)}
.row{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--bg);margin-inline-end:6px}
.empty{text-align:center;color:var(--mut);padding:30px}
</style>
</head>
<body>
<main>
<h1>📅 جدولي الدراسي</h1>
<div id="next" class="next"></div>
<div id="tabs" class="tabs"></div>
<div id="list"></div>
</main>
<script>
const D=["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء"];
// day: index in D, s/e = start/end "HH:MM"
const C=[
{d:0,s:"09:00",e:"10:30",n:"BCS207 - التصميم المنطقي",k:"lec",p:"أ. عبدالرحمن سعيد",w:"F3LH1",g:"مجموعة 1"},
{d:1,s:"09:00",e:"10:30",n:"BCS206 - هيكل البيانات",k:"lec",p:"د. عصام مصطفى",w:"F3 LH2",g:"مجموعة 2"},
{d:1,s:"10:40",e:"12:10",n:"BCS112 - كتابة التقارير الفنية",k:"lec",p:"د. مروة عبدالرازق",w:"F3LH1",g:"مجموعة 2"},
{d:1,s:"13:15",e:"15:40",n:"SAD301 - هندسة البرمجيات",k:"lab",p:"",w:"E2LAB2",g:"مجموعة 1 - معمل 6"},
{d:2,s:"09:00",e:"11:25",n:"BCS206 - هيكل البيانات",k:"lab",p:"",w:"E2Lab2",g:"مجموعة 1 - معمل 3"},
{d:2,s:"11:25",e:"14:00",n:"GEN202 - مهارات الاتصال والعرض",k:"lab",p:"",w:"F3CR1",g:"مجموعة 1 - معمل 1"},
{d:2,s:"14:10",e:"15:40",n:"BCS112 - كتابة التقارير الفنية",k:"sec",p:"",w:"F3CR2",g:"مجموعة 1 - عملي 4"},
{d:3,s:"09:00",e:"09:45",n:"GEN201 - الشفافية وحقوق الإنسان",k:"lec",p:"د. وفاء محب محمد عبدالحميد شلش",w:"غير واضح في الصورة",g:"مجموعة 2"},
{d:3,s:"09:45",e:"10:30",n:"GEN202 - مهارات الاتصال والعرض",k:"lec",p:"أ.د. مروة عبدالرازق",w:"Online",g:"مجموعة 2"},
{d:3,s:"10:40",e:"12:10",n:"BAS203 - المعادلات التفاضلية",k:"lec",p:"أ. Ahmed Mostafa",w:"F3LH1",g:"مجموعة 1"},
{d:3,s:"12:30",e:"14:00",n:"BAS203 - المعادلات التفاضلية",k:"sec",p:"",w:"F3CR3",g:"مجموعة 1 - عملي 6"},
{d:4,s:"09:45",e:"12:10",n:"BCS207 - التصميم المنطقي",k:"lab",p:"",w:"F2Lab2",g:"مجموعة 1 - معمل 5"},
{d:4,s:"12:30",e:"14:00",n:"SAD301 - هندسة البرمجيات",k:"lec",p:"أ.د. مروة عبدالرازق",w:"F3LH1",g:"مجموعة 1"}
];
const kind={lec:"محاضرة",lab:"معمل",sec:"عملي"};
const m=t=>{const[a,b]=t.split(":");return +a*60+ +b};
const now=new Date(new Date().toLocaleString("en-US",{timeZone:"Africa/Cairo"}));
const map=[6,0,1,2,3,4,5]; // JS Sunday=0 -> index in D (Sat=0)
const jsToIdx={6:0,0:1,1:2,2:3,3:4};
const todayIdx=jsToIdx[now.getDay()];
let cur=todayIdx!==undefined?todayIdx:0;
function show(){
 document.querySelectorAll("#tabs button").forEach((b,i)=>b.classList.toggle("on",i===cur));
 const L=C.filter(c=>c.d===cur);
 document.getElementById("list").innerHTML=L.length?L.map(c=>`<div class="cls ${c.k}"><h3>${c.n}</h3><div class="t">🕘 ${c.s} - ${c.e}</div><div class="row"><span class="tag">${kind[c.k]}</span>📍 ${c.w}</div><div class="row">${c.g}${c.p?" · "+c.p:""}</div></div>`).join(""):'<div class="empty">لا توجد محاضرات 🎉</div>';
}
const tabs=document.getElementById("tabs");
D.forEach((n,i)=>{const b=document.createElement("button");b.textContent=n;if(i===todayIdx)b.classList.add("today");b.onclick=()=>{cur=i;show()};tabs.appendChild(b)});
// next class
(function(){
 const nm=now.getHours()*60+now.getMinutes();
 let best=null;
 for(let off=0;off<7&&!best;off++){
  const di=todayIdx===undefined?undefined:null;
  const jsDay=(now.getDay()+off)%7, idx=jsToIdx[jsDay];
  if(idx===undefined)continue;
  const L=C.filter(c=>c.d===idx&&(off>0||m(c.e)>nm)).sort((a,b)=>m(a.s)-m(b.s));
  if(L.length)best={c:L[0],off,idx};
 }
 const el=document.getElementById("next");
 if(!best){el.textContent="لا توجد محاضرات قادمة";return}
 const c=best.c,ongoing=best.off===0&&m(c.s)<=nm;
 el.innerHTML=`<small>${ongoing?"الآن":"المحاضرة القادمة"} — ${best.off===0?"اليوم":D[best.idx]}</small><b>${c.n}</b>${c.s} - ${c.e} · 📍 ${c.w}`;
})();
show();
</script>
</body>
</html>
